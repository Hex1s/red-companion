[package]
name = "rules-core"
description = "Cyberpunk RED rules engine: pure Rust, no Tauri dependency"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rand = "0.10.3"
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slug = "0.1.6"
thiserror = "2.0.21"
ts-rs = "12.0.1"
