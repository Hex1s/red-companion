[workspace]
resolver = "3"
members = ["src-tauri", "crates/rules-core", "crates/storage"]

[workspace.package]
version = "0.9.3"
edition = "2024"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
